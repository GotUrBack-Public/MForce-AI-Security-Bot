name: MForce bot fix PR (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mforce-fix-pr
  cancel-in-progress: false

jobs:
  propose-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply conservative workflow permission fix
        run: python3 scripts/fix_workflow_permissions.py
      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate installation token
        if: steps.changes.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MFORCE_APP_ID }}
          private-key: ${{ secrets.MFORCE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create bot-authored PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          branch="mforce/fix-workflow-permissions"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${{ steps.app.outputs.app-id }}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/workflows
          git commit -m "fix(security): reduce broad workflow token permissions"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "fix(security): reduce write-all workflow permissions" --body "Automated, narrowly scoped change: replace exact top-level permissions: write-all with read-all. Review workflow functionality before merging."
