name: Security baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check "bandit==1.8.6"
      - name: Scan Python source
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f -name '*.py' -not -path './.git/*' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No Python files found"
            exit 0
          fi
          bandit -q -ll "${files[@]}"

  shell-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No shell scripts found"
            exit 0
          fi
          shellcheck "${files[@]}"
